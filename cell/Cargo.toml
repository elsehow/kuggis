[package]
name = "cell"
version = "0.1.0"
edition = "2021"
description = "kuggis cells: the typed core. A cell is a root, a set of grants and a key."
publish = false

[[bin]]
name = "cell"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"

[profile.release]
strip = true
lto = true
