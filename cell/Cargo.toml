[package]
name = "cell"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "kuggis cells: the typed core. A cell is a root, a set of grants and a key."
publish = false

[[bin]]
name = "cell"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
libc = "0.2"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
async-stream = "0.3"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
ts-rs = "12.0.1"

[profile.release]
strip = true
lto = true
