# box: tmux defaults for Claude Code sessions; box sync rewrites this file while this line is first
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g history-limit 50000
set -g extended-keys on
set -g focus-events on
# Don't forward a pane's OSC 52 clipboard writes to the laptop terminal:
# a VM session should not be able to set the owner's clipboard.
set -g set-clipboard off
