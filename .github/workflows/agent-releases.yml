name: Agent release pins
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Fails when a built-in recipe pins an older release than upstream's latest.
      - run: python3 scripts/check-agent-releases.py claude codex
        env:
          GITHUB_TOKEN: ${{ github.token }}
