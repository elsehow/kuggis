# /etc/systemd/system/cell-publisher.service.d/exe.conf
# Native exe.xyz mode only. See README for the private credential and hosts files.
[Service]
Environment=CELL_PUBLISH_INGRESS_HEADERS=/etc/cell-publisher/ingress.headers
# exe.dev's /etc/hosts points the VM's own name at its internal IP. The external
# verifier must instead reach the public DNS/TLS/auth gateway, without pinning IPs.
BindReadOnlyPaths=/etc/cell-publisher/verify-hosts:/etc/hosts
