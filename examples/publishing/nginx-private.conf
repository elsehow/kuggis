# Dedicated publisher host, behind a TRUSTED HTTPS/authentication gateway only.
# The gateway must route *.sites-private.example.com to this loopback listener,
# overwrite X-ExeDev-UserID with the authenticated stable reader identity (or
# remove it for anonymous requests), and preserve the original Host.
# Never expose this listener directly or host agents on this machine.
# Browser cookies terminate at the gateway. The application checks signed Verify
# proofs itself; those requests must reach it without a login redirect.
server {
    listen 127.0.0.1:8010;
    server_name "~^s[a-z2-7]{52}\.sites-private\.example\.com$";
    client_max_body_size 1k;
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-ExeDev-UserID $http_x_exedev_userid;
        proxy_set_header X-Cell-Site-Verification $http_x_cell_site_verification;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
        proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
        proxy_read_timeout 15s;
    }
}
