# Dedicated publisher VM ONLY. Never replace/expose a cell's private door.
# Have exe.dev terminate HTTPS and forward this VM's web traffic to port 8000.
# Place the limit zones in nginx's http context (sites-enabled is normally there).
limit_req_zone $binary_remote_addr zone=publish_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=publish_connections:10m;
server {
    listen 127.0.0.1:8000;
    server_name _;
    client_max_body_size 24m;
    client_body_timeout 15s;
    send_timeout 30s;
    location /v1/ {
        limit_req zone=publish_requests burst=8 nodelay;
        limit_conn publish_connections 8;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8090;
    }
    location /sites/ {
        limit_conn publish_connections 16;
        proxy_pass http://127.0.0.1:8091;
    }
    location / { return 404; }
}
