<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuggis</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
<script src="/app.js"></script>
</head>
<body>
<header class="bb-topbar">
  <span class="bb-brand">kuggis</span>
  <span class="bb-hint" id="status"></span>
  <span class="bb-spacer"></span>
  <label class="bb-hint theme-pick">Theme <select id="theme"></select></label>
</header>
<main class="layout">
  <nav id="list" class="list bb-scroll" aria-label="PRs and sessions"></nav>
  <section id="detail" class="detail bb-scroll" aria-live="polite"></section>
</main>
<footer class="keys">
  <span class="bb-hint"><kbd>j</kbd> <kbd>k</kbd> move</span>
  <span class="bb-hint"><kbd>t</kbd> ask the Thinker</span>
  <span class="bb-hint"><kbd>m</kbd> merge</span>
  <span class="bb-hint"><kbd>s</kbd> send review to its session</span>
  <span class="bb-hint"><kbd>o</kbd> GitHub</span>
  <span class="bb-hint"><kbd>↵</kbd> copy a session's command</span>
  <span class="bb-hint"><kbd>r</kbd> refresh</span>
</footer>
<dialog id="confirm" class="bb-dialog bb-dialog--square"></dialog>
<div id="toast" class="toast" role="status"></div>
</body>
</html>
